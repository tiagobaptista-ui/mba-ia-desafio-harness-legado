# Cada cópia do repositório (worktree) sobe o seu próprio Postgres: `npm run up` chama
# `docker compose -p balcao-<cópia>` com BALCAO_DB_PORT e BALCAO_DB_NAME daquela cópia.
# Sem essas variáveis, vale o padrão de antes (porta 5432, banco balcao).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: ${BALCAO_DB_NAME:-balcao}
    ports:
      - "${BALCAO_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcao -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
